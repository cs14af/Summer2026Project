<!DOCTYPE html>
<html>
<head>
    <title>Birdie</title>
</head>
<body>
    <h1>Welcome to Birdie!</h1>
    {% if user.is_authenticated %}
    <p>Logged in as @{{ user.username }}</p>
    <a href="{% url 'edit_profile' %}">Edit Profile</a> |
    <a href="{% url 'logout' %}">Logout</a>
    {% else %}
    <a href="{% url 'login' %}">Login</a> |
    <a href="{% url 'register' %}">Register</a>
    {% endif %}
</body>
</html>
