<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Birdie</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; /* Soft bluish-gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .register-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #1da1f2; /* A nice "Birdie" blue */
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
        }
        /* Styling the tags generated by {{ form.as_p }} */
        form p {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        form label {
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
            color: #555;
        }
        form input[type="text"],
        form input[type="password"],
        form input[type="email"],
        form input[type="file"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        form input[type="text"]:focus,
        form input[type="password"]:focus,
        form input[type="email"]:focus {
            border-color: #1da1f2;
            outline: none;
        }
        .helptext {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .errorlist {
            color: #e0245e; /* Red for errors */
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            font-size: 13px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
        }
        button:hover {
            background-color: #1a91da;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .login-link a {
            color: #1da1f2;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Create your Birdie account</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a href="{% url 'login' %}">Log in here</a>.</p>
        </div>
    </div>
</body>
</html>
