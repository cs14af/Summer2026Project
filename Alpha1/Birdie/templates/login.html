{% extends 'base.html' %}

{% block content %}
<style>
    .login-page-container {
        max-width: 450px;
        margin: 40px auto;
        background: #ffffff;
        border: 1px solid #e1e8ed;
        border-radius: 5px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        overflow: hidden;
    }

    .login-header {
        background-color: #f5f8fa;
        padding: 12px 20px;
        border-bottom: 1px solid #e1e8ed;
    }

    .login-title {
        margin: 0;
        font-size: 18px;
        font-weight: bold;
        color: #333333;
    }

    .login-content {
        padding: 25px 30px;
    }

    .login-content form p {
        margin-bottom: 15px;
    }

    .login-content form label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 13px;
        color: #333333;
    }

    .login-content form input[type="text"],
    .login-content form input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #cccccc;
        border-radius: 3px;
        font-size: 13px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        box-sizing: border-box;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        color: #333333;
    }

    .login-content form input:focus {
        outline: none;
        border-color: #56b4ef;
        box-shadow: 0 0 5px rgba(86, 180, 239, 0.5);
    }

    .login-footer {
        background-color: #f5f8fa;
        border-top: 1px solid #e1e8ed;
        padding: 15px 20px;
        text-align: center;
        font-size: 13px;
        color: #8899a6;
    }

    .login-footer a {
        color: #0084b4;
        text-decoration: none;
        font-weight: bold;
    }

    .login-footer a:hover {
        text-decoration: underline;
    }

    .btn-login {
        background: linear-gradient(to bottom, #00aced 0%, #0084b4 100%);
        border: 1px solid #00668c;
        color: #ffffff;
        padding: 8px 20px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        text-shadow: 0 -1px 0 rgba(0,0,0,0.2);
        width: 100%;
        margin-top: 10px;
    }

    .btn-login:hover {
        background: #0084b4;
    }
</style>

<div class="login-page-container">
    <div class="login-header">
        <h2 class="login-title">Log in to Birdie</h2>
    </div>
    <div class="login-content">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-login">Log In</button>
        </form>
    </div>
    <div class="login-footer">
        Don't have an account? <a href="{% url 'register' %}">Sign up</a>
    </div>
</div>
{% endblock %}
